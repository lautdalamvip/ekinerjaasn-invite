<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Undangan eKinerja Asisten</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, Noto Sans, sans-serif; margin: 0; padding: 0; background: #f6f7fb; color: #222; }
  .wrap { display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 24px; }
  .card { background: #fff; border: 1px solid #e5e7eb; border-radius: 12px; padding: 24px; max-width: 360px; width: 100%; box-shadow: 0 1px 2px rgba(0,0,0,0.04); text-align: center; }
  h2 { margin: 0 0 8px; font-size: 18px; }
  p { color: #6b7280; font-size: 14px; margin: 0 0 16px; }
  form { display: block; }
  button { background: #15803d; color: #fff; border: 0; padding: 10px 16px; border-radius: 8px; cursor: pointer; font-size: 14px; width: 100%; }
  button:disabled { background: #9ca3af; cursor: not-allowed; }
  .msg { margin-top: 12px; font-size: 13px; min-height: 18px; }
  .error { color: #b91c1c; }
  .ok { color: #166534; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h2>Undangan eKinerja Asisten</h2>
      <p>Kamu diundang untuk menggunakan ekstensi ini. Klik tombol di bawah untuk menerima akses.</p>
      <form id="invite-form" method="GET" action="https://yuewhqrcteunhfymtnno.supabase.co/functions/v1/invite">
        <input type="hidden" name="token" id="token" />
        <button type="submit" id="btn">Terima undangan</button>
      </form>
      <div id="msg" class="msg"></div>
    </div>
  </div>
  <script>
    const params = new URLSearchParams(location.search);
    const token = params.get('token');
    const form = document.getElementById('invite-form');
    const btn = document.getElementById('btn');
    const msg = document.getElementById('msg');
    if (!token) {
      btn.disabled = true;
      msg.className = 'msg error';
      msg.textContent = 'Tautan tidak valid.';
    } else {
      document.getElementById('token').value = token;
      form.addEventListener('submit', () => {
        btn.disabled = true;
        btn.textContent = 'Memproses...';
        msg.className = 'msg';
        msg.textContent = '';
      });
    }
  </script>
</body>
</html>
